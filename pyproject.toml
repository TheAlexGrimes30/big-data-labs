[project]
name = "rbc-etl-lab1"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
description = "RBC news ETL pipelines"

dependencies = [
    "psycopg2-binary==2.9.10",
    "clickhouse-connect==0.9.2",
    "pymongo==4.15.4",
    "redis==6.4.0",
    "matplotlib==3.10.7",
    "apache-airflow==3.1.7",
    "selenium>=4.51.0",
    "bs4>=0.0.2",
    "psycopg2>=2.9.13",
]

[dependency-groups]
dev = [
    "apache-airflow==3.1.7",
    "pytest>=8.3",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
